<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro - Structa</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="description" content="Crea tu cuenta de Structa">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Custom Auth -->
  <style>
    :root {
      --bg-midnight: #0a0a0a;
      --card-bg: rgba(18, 18, 18, 0.7);
      --violet: #d4af37;
      --cyan-glow: #d4af37;
      --text-main: #ffffff;
      --text-muted: #a3a3a3;
      --border-glass: rgba(212, 175, 55, 0.25);
      --glass-bg: rgba(18, 18, 18, 0.7);
    }
    
    body {
      margin: 0;
      font-family: 'Poppins', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-midnight);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      background-image:
        radial-gradient(circle at 15% 50%, rgba(212, 175, 55, 0.05), transparent 25%),
        radial-gradient(circle at 85% 30%, rgba(212, 175, 55, 0.03), transparent 25%);
      background-attachment: fixed;
      background-size: cover;
    }

    .login-container {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 40px;
      border-radius: 20px;
      border: 1px solid var(--border-glass);
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 20px rgba(212, 175, 55, 0.15);
      text-align: center;
      position: relative;
      z-index: 10;
      animation: fadeUp 0.6s ease-out forwards;
    }

    @keyframes fadeUp {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .logo {
      font-weight: 800;
      font-size: 2rem;
      letter-spacing: -0.5px;
      margin-bottom: 5px;
      color: var(--text-main);
    }
    
    .logo span { color: var(--violet); }
    
    .subtitle {
      color: var(--text-muted);
      margin-bottom: 30px;
      font-size: 0.95rem;
    }

    .input-group {
      margin-bottom: 15px;
      text-align: left;
    }
    
    .input-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.9rem;
      color: var(--text-muted);
      font-weight: 500;
    }
    
    .input-group input {
      width: 100%;
      padding: 14px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      color: var(--text-main);
      font-family: inherit;
      font-size: 1rem;
      transition: all 0.3s ease;
      box-sizing: border-box;
    }
    
    .input-group input:focus {
      outline: none;
      border-color: var(--violet);
      box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
      background: rgba(0, 0, 0, 0.6);
    }
    
    .btn {
      width: 100%;
      background: linear-gradient(135deg, #d4af37 0%, #b5952f 100%);
      color: #0a0a0a;
      padding: 15px;
      border: none;
      border-radius: 10px;
      border: 1px solid rgba(212, 175, 55, 0.3);
      font-weight: 700;
      font-size: 1.1rem;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 20px rgba(212, 175, 55, 0.3);
      margin-top: 10px;
    }
    
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(212, 175, 55, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.3);
    }
    
    .btn:disabled {
      background: rgba(212, 175, 55, 0.5);
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
      border-color: transparent;
    }

    .toggle-text {
      margin-top: 25px;
      font-size: 0.95rem;
      color: var(--text-muted);
    }
    
    .toggle-text a {
      color: var(--cyan-glow);
      font-family: inherit;
      font-size: inherit;
      font-weight: 600;
      cursor: pointer;
      padding: 0;
      display: inline;
      transition: color 0.3s ease;
      text-decoration: none;
    }
    
    .toggle-text a:hover {
      text-decoration: underline;
      color: #5EEAD4;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="logo">STRUCTA<span>.</span></div>
    <div class="subtitle">Crea tu cuenta en Structa</div>

    <form id="auth-form">
      <div class="input-group">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" required placeholder="tu@correo.com">
      </div>
      <div class="input-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn" id="submit-btn">Crear Cuenta</button>
    </form>

    <div class="toggle-text">
      ¿Ya tienes una cuenta? <a href="login.html">Inicia sesión aquí</a>
    </div>
  </div>

  <script>
    // Referencias del DOM
    const submitBtn = document.getElementById('submit-btn');
    const authForm = document.getElementById('auth-form');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');

    // Manejar envío del formulario
    authForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      
      // Estado de carga
      submitBtn.disabled = true;
      submitBtn.textContent = 'Registrando...';

      try {
        const response = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (!response.ok) {
          alert(data.error || 'Error al registrar');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Crear Cuenta';
        } else {
          alert('¡Cuenta creada exitosamente!');
          window.location.href = 'login.html';
        }
      } catch (err) {
        alert('ERROR TÉCNICO VERCEL:\n' + err.message + '\nPor favor enviame captura de esto.');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Crear Cuenta';
      }
    });
  </script>
</body>
</html>
