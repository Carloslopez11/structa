services:
  - type: web
    name: vorion-os-server
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node src/server.mjs
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: RETELL_API_KEY
        sync: false
      - key: DASHBOARD_SECRET
        generateValue: true
